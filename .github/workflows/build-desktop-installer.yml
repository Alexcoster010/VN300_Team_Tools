name: Build desktop installer

on:
  push:
    branches: [desktop-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw APP_VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid APP_VERSION' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build tools
        shell: pwsh
        run: |
          py -3 -m pip install --disable-pip-version-check -r packaging/requirements-build.txt
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./packaging/build_windows_installer.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VN300-Team-Tools-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/installer/VN300-Team-Tools-Setup-${{ steps.version.outputs.version }}.exe
            dist/installer/VN300-Team-Tools-Setup-${{ steps.version.outputs.version }}.exe.sha256

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: VN300 Team Tools v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/installer/VN300-Team-Tools-Setup-${{ steps.version.outputs.version }}.exe
            dist/installer/VN300-Team-Tools-Setup-${{ steps.version.outputs.version }}.exe.sha256
